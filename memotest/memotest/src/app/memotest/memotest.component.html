<div class="background">
  <div class="deco-blob deco-blob-1"></div>
  <div class="deco-blob deco-blob-2"></div>
  @if(juegoFlag){
  <div class="game-wrapper">
    <div class="hud">
      <div class="hud-item">
        Tiempo: <span [class.low]="timeLeft <= 10">{{ timeLeft }}s</span>
      </div>
      <div class="hud-item">
        Movimientos: <b>{{ moves }}</b>
      </div>
      <div class="hud-item">
        Pares: <b>{{ matchesFound }}</b> / {{ totalPairs }}
      </div>
    </div>

    <div class="board" [class.locked]="busy">
      <div
        class="card"
        *ngFor="let card of deck; index as i"
        (click)="flipCard(i)"
        [class.matched]="card.matched"
      >
        <div class="card-inner" [class.flipped]="card.flipped || card.matched">
          <div class="card-face card-back">
            <div class="pattern"></div>
          </div>
          <div class="card-face card-front">
            <img [src]="card.image" alt="flag" />
          </div>
        </div>
      </div>
    </div>
  </div>
}
@if(!juegoFlag) {
  <img src='cards/logo-suramericanos.svg' alt="Juegos Suramericanos" class="main-logo">
  <h1 class="title-text">Memotest</h1>
  <h3 class="subtitle-text">Encontrá los ocho pares de banderas antes de que se termine el tiempo</h3>
  <button class="button-default" (click)="jugar()">JUGAR</button>
}
@if(countdownVisible){
  <div class="countdown-overlay">
    <div class="countdown-text" [ngClass]="countdownAnimClass">{{ countdownText }}</div>
  </div>
}
<div class="footer">
  <div class="footer-logos">
    <img src='cards/logo-suramericanos.svg' alt="Juegos Suramericanos">
    <img src='cards/logo-santafe.svg' alt="Santa Fe">
    <img src='cards/logo-rosario.svg' alt="Rosario">
    <img src='cards/logo-rafaela.svg' alt="Rafaela">
    <img src='cards/logo-municipio-sf.svg' alt="Municipalidad Santa Fe">
  </div>
</div>
</div>
